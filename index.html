<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jam digital dan jadwal salat harian untuk Medan, Indonesia.">
  <title>Jam Sholat — Medan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Jam Sholat</h1>
    <p>Jadwal salat hari ini · Medan, Indonesia</p>
    <section aria-labelledby="clock-heading">
      <h2 id="clock-heading">Jam saat ini</h2>
      <div id="clock" class="clock" role="timer" aria-live="off">--:--:--</div>
    </section>
    <section class="schedule" aria-label="Jadwal salat Medan">
      <p><span>Subuh</span><time id="subuh">--:--</time></p>
      <p><span>Dzuhur</span><time id="dzuhur">--:--</time></p>
      <p><span>Ashar</span><time id="ashar">--:--</time></p>
      <p><span>Maghrib</span><time id="maghrib">--:--</time></p>
      <p><span>Isya</span><time id="isya">--:--</time></p>
    </section>
    <p class="note">Jadwal diperbarui dari layanan Aladhan. Jam menampilkan Waktu Indonesia Barat (WIB).</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
